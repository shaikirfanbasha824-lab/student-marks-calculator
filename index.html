<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <p class="eyebrow">STUDENT TOOL</p>
      <h1>Student Marks Calculator</h1>
      <p class="subtitle">Enter your details and marks to calculate your result.</p>

      <form id="marksForm">
        <label for="studentName">Student name</label>
        <input id="studentName" type="text" placeholder="Enter student name" required maxlength="60">

        <label for="rollNumber">Roll number</label>
        <input id="rollNumber" type="text" placeholder="Enter roll number" required maxlength="30">

        <div class="marks-grid">
          <div>
            <label for="subject1">Subject 1</label>
            <input id="subject1" type="number" min="0" max="100" step="1" placeholder="0–100" required>
          </div>
          <div>
            <label for="subject2">Subject 2</label>
            <input id="subject2" type="number" min="0" max="100" step="1" placeholder="0–100" required>
          </div>
          <div>
            <label for="subject3">Subject 3</label>
            <input id="subject3" type="number" min="0" max="100" step="1" placeholder="0–100" required>
          </div>
          <div>
            <label for="subject4">Subject 4</label>
            <input id="subject4" type="number" min="0" max="100" step="1" placeholder="0–100" required>
          </div>
          <div>
            <label for="subject5">Subject 5</label>
            <input id="subject5" type="number" min="0" max="100" step="1" placeholder="0–100" required>
          </div>
        </div>

        <button type="submit">Calculate Result</button>
        <button type="reset" class="secondary">Clear Form</button>
      </form>

      <section id="result" class="result hidden" aria-live="polite">
        <h2>Result Summary</h2>
        <p><strong>Student:</strong> <span id="resultName"></span></p>
        <p><strong>Roll number:</strong> <span id="resultRoll"></span></p>
        <div class="summary-grid">
          <div><span>Total marks</span><strong id="totalMarks">0 / 500</strong></div>
          <div><span>Percentage</span><strong id="percentage">0%</strong></div>
          <div><span>Grade</span><strong id="grade">-</strong></div>
          <div><span>Status</span><strong id="status">-</strong></div>
        </div>
        <p id="resultNote" class="note"></p>
      </section>
      <p class="footnote">Demo rule: each subject is out of 100; passing requires at least 35 in every subject.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
